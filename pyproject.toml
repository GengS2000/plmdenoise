[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plmdenoise"
version = "0.1.0"
description = "Probabilistic longitudinal microbiome denoising with flexible event responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.1,<3"]

[project.scripts]
plmdenoise = "plmdenoise._model:main"

[tool.setuptools.packages.find]
where = ["src"]
